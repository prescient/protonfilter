[package]
name = "protonfilter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
comfy-table = "8.0.1"
csv = "1.4.0"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
flate2 = "1.1.11"
futures = "0.3.34"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "query", "form", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
