<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- ProtonFilter: a gamepad whose face buttons use the app's tier colours,
       with a filter badge. Plain shapes and gradients only, so KDE's SVG
       renderer draws it the same as a browser. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4fcf"/>
      <stop offset="1" stop-color="#20214a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3f5"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d25c"/>
      <stop offset="1" stop-color="#e0a21f"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tile)"/>
  <path d="M34 6 H94 A28 28 0 0 1 122 34 V60 H6 V34 A28 28 0 0 1 34 6 Z" fill="url(#shine)"/>

  <!-- Gamepad -->
  <path d="M39 37 H89 C101 37 107 44 110 55 L116 79 C118 90 110 97 101 94
           C95 92 92 86 88 81 C79 78 49 78 40 81 C36 86 33 92 27 94
           C18 97 10 90 12 79 L18 55 C21 44 27 37 39 37 Z"
        fill="url(#pad)"/>
  <!-- D-pad -->
  <rect x="28" y="55" width="22" height="7" rx="2" fill="#2a2c5c"/>
  <rect x="35.5" y="47.5" width="7" height="22" rx="2" fill="#2a2c5c"/>
  <!-- Face buttons: native, gold, bronze, platinum -->
  <circle cx="89" cy="49" r="5" fill="#3fb767"/>
  <circle cx="98" cy="58.5" r="5" fill="#e3b532"/>
  <circle cx="89" cy="68" r="5" fill="#d9782d"/>
  <circle cx="80" cy="58.5" r="5" fill="#5f86c7"/>

  <!-- Filter badge -->
  <circle cx="99" cy="99" r="20" fill="#20214a"/>
  <circle cx="99" cy="99" r="16.5" fill="url(#badge)"/>
  <path d="M88.5 91 H109.5 L101.5 100.5 V108.5 L96.5 106 V100.5 Z" fill="#20214a"/>
</svg>
